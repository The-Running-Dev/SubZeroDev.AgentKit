name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  # Typecheck, the no-runtime-dependency check and the Node tests on every OS and on both the
  # Node floor and the current release, through the shared library. Its `node / Result` check
  # is the one a ruleset requires.
  node:
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/node-ci.yml@v0
    permissions:
      contents: read
    with:
      os: '["windows-latest", "ubuntu-latest", "macos-latest"]'
      node-versions: '["22.18.0", "24"]'
      scripts: typecheck check:no-runtime-dependencies test

  # The checks that run once rather than per OS and Node: they need the whole history, a runner
  # without PowerShell, or a Node below the floor.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18.0"
      # verification: true
      - name: Install Node development dependencies
        shell: bash
        run: npm ci
      # verification: true
      - name: Fresh install without PowerShell
        shell: bash
        env:
          AGENTKIT_PROVE_NO_PWSH: '1'
        run: node --test tools/install-without-powershell.test.ts
      # verification: true
      - name: Check commits carry no AI attribution
        shell: bash
        env:
          ATTRIBUTION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ATTRIBUTION_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node tools/test-no-attribution.ts
      # Last: switches to a Node below the floor to prove setup.ts refuses it by name.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.17.0"
      - name: Old Node gets the AgentKit refusal
        shell: bash
        run: .github/scripts/test-old-node-refusal.sh

  videos:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: videos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Runs videos/scripts/patch-videowright.sh as its postinstall step, so a
      # patch that silently no-ops (#261) is caught here rather than only
      # locally.
      - name: Install videos/ dependencies
        shell: bash
        run: npm ci

      # verification: true
      - name: Typecheck videos/
        shell: bash
        run: npx tsc --noEmit

      # verification: true
      - name: Lint videos/
        shell: bash
        run: npx @biomejs/biome lint segments components styles videos videowright.config.ts scripts
