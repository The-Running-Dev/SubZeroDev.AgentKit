name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  node-windows:
    name: node-windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # verification: true
      - name: Install Node development dependencies
        shell: bash
        run: npm ci
      # verification: true
      - name: Typecheck tools
        shell: bash
        run: npx tsc --noEmit
      # verification: true
      - name: Check no runtime dependencies
        shell: bash
        run: node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); if (Object.keys(p.dependencies ?? {}).length) throw new Error('Runtime dependencies are forbidden');"
      # verification: true
      - name: Run Node tests
        shell: bash
        run: node --test tools/
      # verification: true
      - name: Check commits carry no AI attribution
        shell: bash
        env:
          ATTRIBUTION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ATTRIBUTION_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node tools/test-no-attribution.ts

  node-linux:
    name: node-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # verification: true
      - name: Install Node development dependencies
        shell: bash
        run: npm ci
      # verification: true
      - name: Typecheck tools
        shell: bash
        run: npx tsc --noEmit
      # verification: true
      - name: Check no runtime dependencies
        shell: bash
        run: node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); if (Object.keys(p.dependencies ?? {}).length) throw new Error('Runtime dependencies are forbidden');"
      # verification: true
      - name: Run Node tests
        shell: bash
        run: node --test tools/
      # verification: true
      - name: Fresh install without PowerShell
        shell: bash
        env:
          AGENTKIT_PROVE_NO_PWSH: '1'
        run: node --test tools/install-without-powershell.test.ts

  node-macos:
    name: node-macos
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # verification: true
      - name: Install Node development dependencies
        shell: bash
        run: npm ci
      # verification: true
      - name: Typecheck tools
        shell: bash
        run: npx tsc --noEmit
      # verification: true
      - name: Check no runtime dependencies
        shell: bash
        run: node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); if (Object.keys(p.dependencies ?? {}).length) throw new Error('Runtime dependencies are forbidden');"
      # verification: true
      - name: Run Node tests
        shell: bash
        run: node --test tools/

  node-windows-required:
    name: node-windows
    needs: node-windows
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both Node versions to pass
        env:
          MATRIX_RESULT: ${{ needs.node-windows.result }}
        run: test "$MATRIX_RESULT" = success

  node-linux-required:
    name: node-linux
    needs: node-linux
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both Node versions to pass
        env:
          MATRIX_RESULT: ${{ needs.node-linux.result }}
        run: test "$MATRIX_RESULT" = success

  node-macos-required:
    name: node-macos
    needs: node-macos
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both Node versions to pass
        env:
          MATRIX_RESULT: ${{ needs.node-macos.result }}
        run: test "$MATRIX_RESULT" = success

  videos:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: videos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Runs videos/scripts/patch-videowright.sh as its postinstall step, so a
      # patch that silently no-ops (#261) is caught here rather than only
      # locally.
      - name: Install videos/ dependencies
        shell: bash
        run: npm ci

      # verification: true
      - name: Typecheck videos/
        shell: bash
        run: npx tsc --noEmit

      # verification: true
      - name: Lint videos/
        shell: bash
        run: npx @biomejs/biome lint segments components styles videos videowright.config.ts scripts
