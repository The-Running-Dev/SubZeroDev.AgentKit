name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      # Full history: the design-state check resolves merge-base ancestry for every WorkRef's
      # MirroredAt sha, which a shallow (default depth-1) checkout can't do - ShallowCheckout
      # would fire for every one and fail S12.5 with no real drift to show for it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # verification: true
      - name: Parse-check PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) {
              Write-Error "Parse errors in $($_.FullName): $($parseErrors -join '; ')"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # S12.5 calls the real, gh-calling design-state check against this repository and
      # expects exit 0 - the same reason the later "Check the design state against the
      # tree" step below carries GH_TOKEN. Without it here, an unauthenticated gh makes
      # that one test a could-not-evaluate (TrackerUnavailable) rather than a check of
      # anything this step is meant to gate (#79).
      # verification: true
      - name: Run Pester tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $result = Invoke-Pester -Path tools -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      # Exit 2 (NotEvaluated) fails this step as well as exit 1 - .claude/COMPANIONS.md
      # going missing means nothing was checked, which must not read as a pass.
      #
      # The flag must sit on the line immediately above `- name:`; a comment between the
      # two hides the step from discovery entirely.
      # verification: true
      - name: Validate the core/companion split
        shell: pwsh
        run: ./tools/Test-Companion.ps1 | Out-Null

      # Exit 2 (could not evaluate) fails this step exactly as exit 1 does. A gate that failed
      # only on 1 would turn "the design state was never read" into a passing build - I19 and
      # I20 defeated at the call site rather than by the script, which is the substitution
      # design/20-contract.md § tools/Test-DesignState.ps1 puts on the caller.
      #
      # GH_TOKEN is what keeps TrackerUnavailable off that list: the checker probes gh
      # unconditionally, an unauthenticated CLI is a contracted could-not-evaluate, and without
      # a token this step would be red on every run for a reason that says nothing at all about
      # the design state.
      #
      # The flag sits on the line immediately above `- name:`, which is where
      # .claude/commands/verify.md says discovery looks for it.
      # verification: true
      - name: Check the design state against the tree
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./tools/Test-DesignState.ps1 | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  videos:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: videos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Runs videos/scripts/patch-videowright.sh as its postinstall step, so a
      # patch that silently no-ops (#261) is caught here rather than only
      # locally.
      - name: Install videos/ dependencies
        shell: bash
        run: npm ci

      # verification: true
      - name: Typecheck videos/
        shell: bash
        run: npx tsc --noEmit

      # verification: true
      - name: Lint videos/
        shell: bash
        run: npx @biomejs/biome lint segments components styles videos videowright.config.ts scripts
